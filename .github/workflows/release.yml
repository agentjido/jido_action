name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Prepare a release or publish an existing tag"
        required: true
        type: choice
        default: publish
        options:
          - prepare
          - publish
      tag_name:
        description: "Existing v-prefixed SemVer tag for publish"
        required: false
        type: string
        default: ""
      version_override:
        description: "v-prefixed SemVer version for prepare (for example v3.0.0-beta.11)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Validate the release without Hex or GitHub publication"
        required: false
        type: boolean
        default: false
      hex_dry_run:
        description: "Run Hex package validation without publication"
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Release
    uses: agentjido/github-actions/.github/workflows/jido-release.yml@v5
    with:
      operation: ${{ inputs.operation || 'publish' }}
      tag_name: ${{ inputs.tag_name }}
      version_override: ${{ inputs.version_override || '' }}
      otp_version: "29"
      elixir_version: "1.20"
      preflight_command: >-
        mix quality &&
        MIX_ENV=test mix test --cover --warnings-as-errors &&
        mix hex.audit
      dry_run: ${{ inputs.dry_run || false }}
      hex_dry_run: ${{ inputs.hex_dry_run || false }}
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
