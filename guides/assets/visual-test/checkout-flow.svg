xt></g><g class="jfd-node jfd-k-subflow" style="--h:174;--s:62%" transform="translate(58,138)"><rect class="jfd-card" width="224" height="128" rx="10"/><path class="jfd-band" d="M0,26 V10 Q0,0 10,0 H214 Q224,0 224,10 V26 Z"/><rect class="jfd-icon-line" x="12" y="7" width="13" height="13" rx="3"/><rect class="jfd-icon" x="15.5" y="10.5" width="6" height="6" rx="1.5"/><text class="jfd-kind" x="32" y="17.5">NESTED FLOW</text><text class="jfd-name" x="14" y="50">greeting</text><text class="jfd-mono jfd-target" x="14" y="68">FirstFlow.Greeting</text><rect class="jfd-inner" x="14" y="82" width="196" height="38" rx="8"/><rect class="jfd-inner-step" x="22.0" y="91" width="79.0" height="20" rx="6"/><text class="jfd-mono" x="61.5" y="105" text-anchor="middle">normalize</text><path class="jfd-edge" d="M105.0,101 H113.0"/><polygon class="jfd-arrow" points="119.0,101 113.0,97.5 113.0,104.5"/><rect class="jfd-inner-step" x="123.0" y="91" width="79.0" height="20" rx="6"/><text class="jfd-mono" x="162.5" y="105" text-anchor="middle">greet</text></g><g class="jfd-node jfd-k-map" style="--h:205;--s:78%" transform="translate(338,138)"><rect class="jfd-ghost" x="10" y="10" width="224" height="110" rx="10"/><rect class="jfd-ghost" x="5" y="5" width="224" height="110" rx="10"/><rect class="jfd-card" width="224" height="110" rx="10"/><path class="jfd-band" d="M0,26 V10 Q0,0 10,0 H214 Q224,0 224,10 V26 Z"/><rect class="jfd-icon-line" x="16" y="6" width="9" height="9" rx="2"/><rect class="jfd-icon" x="12" y="10" width="9" height="9" rx="2"/><text class="jfd-kind" x="32" y="17.5">MAP</text><text class="jfd-name" x="14" y="50">lines</text><text class="jfd-mono jfd-target" x="14" y="68">FirstFlow.LineTotal</text><rect class="jfd-chip" x="14" y="80" width="101.8" height="20" rx="10"/><text class="jfd-mono jfd-chip-text" x="64.9" y="94" text-anchor="middle">for each item</text></g><g class="jfd-node jfd-k-reduce" style="--h:30;--s:88%" transform="translate(338.0,332)"><rect class="jfd-card" widt