<svg xmlns="http://www.w3.org/2000/svg" class="jfd" viewBox="0 0 640 778" width="640" height="778" role="img" aria-labelledby="title description">
<title id="title">Parent and child Flow boundaries</title>
<desc id="description">NestedFlows.Parent passes value one into child. The child add step produces value two and exposes it through the child output. The parent finish step reads that output and adds one again. The parent output is value three. Child input and result references stay within the child boundary.</desc>
<style>
.jfd{--jfd-bg:#fff;--jfd-card:hsl(207,43%,98.5%);--jfd-border:hsl(212,33%,91%);--jfd-text:hsl(218,73%,4%);--jfd-muted:hsl(240,5%,46%);--jfd-edge:hsl(210,21%,64%);--jfd-l:44%;--jfd-tint:.13;--jfd-sans:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;--jfd-monof:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){.jfd{--jfd-bg:hsl(218,73%,4%);--jfd-card:hsl(216,52%,11%);--jfd-border:hsl(211,32%,22%);--jfd-text:hsl(212,33%,91%);--jfd-muted:hsl(210,21%,64%);--jfd-edge:hsl(210,21%,34%);--jfd-l:74%;--jfd-tint:.2}}
.jfd text{font-family:var(--jfd-sans)}
.jfd .jfd-mono,.jfd .jfd-mono *{font-family:var(--jfd-monof);font-size:11px;fill:var(--jfd-muted)}
.jfd .jfd-edge{fill:none;stroke:var(--jfd-edge);stroke-width:1.6}
.jfd .jfd-arrow{fill:var(--jfd-edge)}
.jfd .jfd-card{fill:var(--jfd-card);stroke:hsl(var(--h) var(--s) 62%);stroke-width:1.5}
.jfd .jfd-ghost{fill:var(--jfd-card);stroke:hsl(var(--h) var(--s) 62% / .45);stroke-width:1.2}
.jfd .jfd-band{fill:hsl(var(--h) var(--s) 62% / var(--jfd-tint))}
.jfd .jfd-icon{fill:hsl(var(--h) var(--s) var(--jfd-l))}
.jfd .jfd-icon-line{fill:none;stroke:hsl(var(--h) var(--s) var(--jfd-l));stroke-width:1.8}
.jfd .jfd-icon-text{font-family:var(--jfd-monof);font-size:12px;font-weight:700;fill:hsl(var(--h) var(--s) var(--jfd-l))}
.jfd .jfd-kind{font-size:10px;font-weight:700;letter-spacing:.09em;fill:hsl(var(--h) var(--s) var(--jfd-l))}
.jfd .jfd-name{font-size:15px;font-weight:700;fill:var(--jfd-text)}
.jfd .jfd-chip{fill:hsl(var(--h) var(--s) 62% / var(--jfd-tint))}
.jfd .jfd-chip-text{fill:hsl(var(--h) var(--s) var(--jfd-l))}
.jfd .jfd-inner{fill:none;stroke:hsl(var(--h) var(--s) 62% / .7);stroke-dasharray:4 3}
.jfd .jfd-inner-step{fill:var(--jfd-bg);stroke:var(--jfd-border)}
.jfd .jfd-option{fill:var(--jfd-bg);stroke:var(--jfd-border)}
.jfd .jfd-diamond{fill:hsl(var(--h) var(--s) var(--jfd-l))}
.jfd .jfd-diamond-open{fill:none;stroke:hsl(var(--h) var(--s) var(--jfd-l));stroke-width:1.5}
.jfd .jfd-option-name{font-size:12.5px;font-weight:700;fill:var(--jfd-text)}
.jfd .jfd-option-cond{font-size:10.5px}
.jfd .jfd-option-target{font-size:10.5px}
.jfd .jfd-pill-box{fill:hsl(250 68% 62% / var(--jfd-tint));stroke:hsl(250 68% 62% / .55);stroke-width:1.3}
.jfd .jfd-pill-title{font-size:12.5px;font-weight:700;fill:var(--jfd-text)}
.jfd .jfd-field{fill:var(--jfd-bg);stroke:var(--jfd-border)}
.jfd .jfd-label rect{fill:var(--jfd-bg);stroke:var(--jfd-border)}
.jfd .jfd-label text{font-family:var(--jfd-monof);font-size:10.5px;fill:var(--jfd-muted)}

.jfd .jfd-background{fill:var(--jfd-bg)}
.jfd .jfd-control{stroke-dasharray:5 4}
</style>
<rect class="jfd-background" width="640" height="778" rx="12"/>
<g transform="translate(170,20)"><rect class="jfd-pill-box" width="300" height="48" rx="16"/><text class="jfd-pill-title" x="150.0" y="19" text-anchor="middle">Parent input</text><text class="jfd-mono" x="150.0" y="36" text-anchor="middle">%{value: 1}</text></g><path class="jfd-edge" data-from="$input" data-to="child" d="M320,68 C320,90.0 320,90.0 320,105"/><polygon class="jfd-arrow" points="320,112 315.5,104 324.5,104"/><g class="jfd-node" style="--h:250;--s:62%" transform="translate(120,112)"><rect class="jfd-card" width="400" height="370" rx="10"/><path class="jfd-band" d="M0,26 V10 Q0,0 10,0 H390 Q400,0 400,10 V26 Z"/><text class="jfd-kind" x="14" y="18">SUBFLOW</text><text class="jfd-name" x="14" y="52">child</text><text class="jfd-mono" x="14" y="76">NestedFlows.Child</text><g transform="translate(60,94)"><rect class="jfd-pill-box" width="280" height="48" rx="16"/><text class="jfd-pill-title" x="140.0" y="19" text-anchor="middle">Child input</text><text class="jfd-mono" x="140.0" y="36" text-anchor="middle">%{value: 1}</text></g><path class="jfd-edge" data-from="child.$input" data-to="child.add" d="M200,142 C200,159.0 200,159.0 200,169"/><polygon class="jfd-arrow" points="200,176 195.5,168 204.5,168"/><g class="jfd-node" style="--h:174;--s:62%" transform="translate(42,176)"><rect class="jfd-card" width="316" height="94" rx="10"/><path class="jfd-band" d="M0,26 V10 Q0,0 10,0 H306 Q316,0 316,10 V26 Z"/><text class="jfd-kind" x="14" y="18">STEP</text><text class="jfd-name" x="14" y="52">add</text><text class="jfd-mono" x="14" y="75">NestedFlows.AddOne</text></g><path class="jfd-edge" data-from="child.add" data-to="child.$output" d="M200,270 C200,287.0 200,287.0 200,297"/><polygon class="jfd-arrow" points="200,304 195.5,296 204.5,296"/><g transform="translate(60,304)"><rect class="jfd-pill-box" width="280" height="48" rx="16"/><text class="jfd-pill-title" x="140.0" y="19" text-anchor="middle">Child output</text><text class="jfd-mono" x="140.0" y="36" text-anchor="middle">%{value: 2}</text></g></g><path class="jfd-edge" data-from="child" data-to="finish" d="M320,482 C320,508.0 320,508.0 320,527"/><polygon class="jfd-arrow" points="320,534 315.5,526 324.5,526"/><g class="jfd-node" style="--h:174;--s:62%" transform="translate(162,534)"><rect class="jfd-card" width="316" height="94" rx="10"/><path class="jfd-band" d="M0,26 V10 Q0,0 10,0 H306 Q316,0 316,10 V26 Z"/><text class="jfd-kind" x="14" y="18">STEP</text><text class="jfd-name" x="14" y="52">finish</text><text class="jfd-mono" x="14" y="75">NestedFlows.AddOne</text></g><path class="jfd-edge" data-from="finish" data-to="$output" d="M320,628 C320,655.0 320,655.0 320,675"/><polygon class="jfd-arrow" points="320,682 315.5,674 324.5,674"/><g transform="translate(140,682)"><rect class="jfd-pill-box" width="360" height="48" rx="16"/><text class="jfd-pill-title" x="180.0" y="19" text-anchor="middle">Parent output</text><text class="jfd-mono" x="180.0" y="36" text-anchor="middle">%{value: result(&quot;finish&quot;, :value)}</text></g><text class="jfd-mono" x="320" y="750" text-anchor="middle">For input 1, the parent returns %{value: 3}.</text>
</svg>
